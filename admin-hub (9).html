<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ศูนย์รวมระบบงานธุรการสาขา และคลังสินค้า</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23006BB6'/%3E%3Cpath fill='%23fff' d='M32 13l17 9.5-17 9.5-17-9.5z'/%3E%3Cpath fill='%23fff' fill-opacity='.7' d='M15 22.5l17 9.5v19l-17-9.5z'/%3E%3Cpath fill='%23fff' fill-opacity='.45' d='M49 22.5L32 32v19l17-9.5z'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#006BB6; --primary-dk:#003B66; --primary-lt:#E6F0F9;
  --accent:#ED1C24; --second:#FFE600;
  --bg:#F3F5F8; --surface:#FFFFFF; --text:#0E1726; --muted:#6B7584; --line:#E6EAF0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --primary:#3C9EE4; --primary-dk:#0A2C4D; --primary-lt:#13263A;
    --accent:#FF4D55; --bg:#0C1017; --surface:#151B24; --text:#E8EDF4; --muted:#8792A2; --line:#232B37;
  }
}
:root[data-theme="dark"]{
  --primary:#3C9EE4; --primary-dk:#0A2C4D; --primary-lt:#13263A;
  --accent:#FF4D55; --bg:#0C1017; --surface:#151B24; --text:#E8EDF4; --muted:#8792A2; --line:#232B37;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 28px}

/* HEADER */
.top{background:var(--surface);border-radius:24px;padding:20px 22px;margin-bottom:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;
  background:var(--primary);box-shadow:0 8px 18px rgba(0,80,140,.28)}
.ttl{flex:1;min-width:240px}
.ttl h1{margin:0;font-size:clamp(20px,2.6vw,28px);font-weight:700;letter-spacing:-.3px;line-height:1.2}
.ttl p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;width:300px;background:var(--bg);border-radius:999px;padding:0 8px 0 14px}
.search svg{flex:none;color:var(--muted)}
#q{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:14px;padding:11px 0;color:var(--text);min-width:0}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:1px 7px;color:var(--muted)}
.pill{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:.15s}
.pill.solid{color:#fff;background:var(--primary);box-shadow:0 8px 18px rgba(0,80,140,.25)}
.pill.solid:hover{filter:brightness(1.1)}
.pill.solid.on{background:var(--accent);box-shadow:0 8px 18px rgba(237,28,36,.25)}
.round{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:.15s}
.round:hover{border-color:var(--primary);color:var(--primary)}

/* ROWS */
.row{--c:var(--primary);--c2:var(--second);display:grid;grid-template-columns:64px 1fr;gap:12px;margin-bottom:12px;animation:up .4s ease both}
.band{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px 0;border-radius:22px;overflow:hidden;
  background:var(--c);
  box-shadow:0 10px 22px color-mix(in srgb,var(--c) 28%,transparent)}
.band svg{width:20px;height:20px;color:var(--on,#fff);position:relative;flex:none}
.band span{position:relative;writing-mode:vertical-rl;transform:rotate(180deg);color:var(--on,#fff);font-weight:700;font-size:13px;letter-spacing:1.4px;white-space:pre-line;text-align:center;line-height:1.25}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

.card{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 14px 16px;min-height:186px;
  background:var(--surface);border:1px solid transparent;border-radius:22px;text-decoration:none;color:inherit;
  transition:transform .2s cubic-bezier(.2,.8,.3,1),box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 40%,transparent);box-shadow:0 16px 34px rgba(14,23,38,.09)}
.card:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 35%,transparent);outline-offset:2px}
.go{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--text);display:grid;place-items:center;transition:.2s;opacity:.85}
.go svg{width:15px;height:15px}
.card:hover .go{background:var(--c);border-color:var(--c);color:var(--on,#fff);opacity:1;transform:rotate(45deg)}
.card.soon .go{border-color:var(--line);color:var(--muted)}
.star{all:unset;cursor:pointer;position:absolute;top:12px;left:12px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#c2cad5;transition:.15s;z-index:2}
.star svg{width:17px;height:17px}
.star:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.star.on{color:var(--accent)}
.ico{width:66px;height:66px;margin:6px 0 12px;transition:transform .3s cubic-bezier(.2,.8,.3,1)}
.ico svg{width:100%;height:100%;overflow:visible}
.card:hover .ico{transform:scale(1.07)}
.name{font-size:16.5px;font-weight:700;line-height:1.35}
.th{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:2px;letter-spacing:.2px}
.desc{font-size:12px;color:var(--muted);margin-top:1px}
.tag{margin-top:auto;padding-top:10px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.tag i{font-style:normal;display:inline-grid;place-items:center;min-width:20px;height:16px;padding:0 4px;border-radius:5px;font-size:10px;border:1px solid currentColor}
.card.live .tag{color:var(--tag,var(--c))}
.card.soon .tag{color:var(--muted);font-weight:500}
.card.soon{cursor:default}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:186px;border-radius:22px;border:2px dashed var(--line);color:var(--muted);font-size:13px;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.slot b{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:400;color:#b5bfcc}
.card.soon .tag i{border-color:var(--line)}

/* icon paint — solid */
.p{fill:var(--c);stroke:color-mix(in srgb,var(--c) 80%,#000);stroke-opacity:var(--edge,0);stroke-width:1.2} .m{fill:var(--c2)} .s{fill:var(--c2);opacity:.28} .w{fill:var(--surface)}
.ln{fill:none;stroke:var(--c);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.lw{fill:none;stroke:var(--surface);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.lm{fill:none;stroke:var(--c2);stroke-opacity:.35;stroke-width:9;stroke-linecap:round}
.lp{fill:none;stroke:var(--c);stroke-width:9;stroke-linecap:round}

.empty{text-align:center;color:var(--muted);padding:50px 10px;background:var(--surface);border-radius:22px}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:12px;margin-top:14px;padding:0 6px}

@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:1020px){ .cards{grid-template-columns:repeat(3,1fr)} .search{width:240px} }
@media (max-width:720px){
  .wrap{padding:10px}
  .top{padding:16px;border-radius:20px}
  .tools{width:100%} .search{flex:1;width:auto} kbd,.pill .lbl{display:none} .pill{padding:11px 13px}
  .row{grid-template-columns:1fr;gap:8px}
  .band{flex-direction:row;justify-content:flex-start;padding:10px 16px;border-radius:16px}
  .band span{writing-mode:horizontal-tb;transform:none;white-space:normal;letter-spacing:1px}
  .cards{grid-template-columns:repeat(2,1fr);gap:10px}
  .slot{min-height:150px;border-radius:18px}
  .card{min-height:170px;padding:16px 10px 14px;border-radius:18px}
  .ico{width:52px;height:52px}
  .go,.star{width:30px;height:30px}
  .name{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div>

/* ===== แก้/เพิ่มลิงก์ตรงนี้ ===== url:"#" = ยังไม่มีลิงก์ */
const LINKS = [
  { cat:"daily",   icon:"todo",      th:"TO DO LIST", name:"Daily Branch Tasks", desc:"งานที่สาขาต้องจัดการประจำวัน", url:"https://wuttinuntn-design.github.io/TODOLIST-DC/" },
  { cat:"billing", icon:"billtrack", th:"ระบบติดตามการจัดการสถานะอายุบิล", name:"Bill Tracker", desc:"สถานะ & อายุบิลค้าง", url:"https://bill-manage-updesign.netlify.app/" },
  { cat:"billing", icon:"truck",     th:"ระบบติดตามการจัดการสถานะบิลต้นทาง", name:"Bill Movement", desc:"สถานะบิล ณ สาขาต้นทาง", url:"https://wuttinuntn-design.github.io/Bill_Movement/" },
  { cat:"people",  icon:"team",      th:"ระบบบริหารการจัดการกำลังคนสาขา", name:"Branch Manpower", desc:"ตารางกะ & กำลังคนรายสาขา", url:"https://wuttinuntn-design.github.io/NIM_MANPOWER/" },
];
const SLOTS = 4;   /* จำนวนช่องต่อแถว (เติมการ์ดรอให้ครบ) */

const NAV_ICO = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="17" rx="3"/><path d="M9 3h6v3H9zM8 12l2.5 2.5L16 9"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.3l-5.6 2.9 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>',
  team:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-6 6.5-6s5.9 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.8.2 4.8 2.4 5.3 5.3"/></svg>',
  truck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h11v10H2zM13 9h4.5l3.5 4v3h-8"/><circle cx="6" cy="17.5" r="2"/><circle cx="17" cy="17.5" r="2"/></svg>',
  wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 13h2M3 10h18M6 6l9-3 1.5 3"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8.5 4.5v9L12 21l-8.5-4.5v-9z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8.3-8 9.5C7.5 20.3 4 17 4 12V6z"/><path d="M8.5 12l2.5 2.5 4.5-4.5"/></svg>',
};
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>';
const STAR  = NAV_ICO.star;
const STAR_O= '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.3l-5.6 2.9 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>';

const $ = s => document.querySelector(s);
const store = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let favs = store.get("ah_fav", []), q = "", favOnly = false;
const live = l => l.url && l.url !== "#";
const catOf = k => CATS.find(c=>c.key===k) || {tone:BLUE,tone2:YELLOW,on:"#fff"};

const t = store.get("ah_theme", null); if (t) document.documentElement.dataset.theme = t;
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next; store.set("ah_theme", next);
};

function card(l){
  const fav = favs.includes(l.name), on = live(l);
  return `<a class="card ${on?'live':'soon'}" style="--c:${catOf(l.cat).tone};--c2:${catOf(l.cat).tone2};--on:${catOf(l.cat).on};--tag:${catOf(l.cat).tone===YELLOW?BLUE:catOf(l.cat).tone}" href="${on?l.url:'javascript:void(0)'}" ${on?'target="_blank" rel="noopener"':''}>
    <button class="star ${fav?'on':''}" data-f="${l.name}" aria-label="ปักหมุด">${fav?STAR:STAR_O}</button>
    <span class="go">${ARROW}</span>
    <div class="ico"><svg viewBox="0 0 64 64">${ICONS[l.icon]||ICONS.box}</svg></div>
    <div class="name">${l.th||l.name}</div>
    <div class="th">${l.th?l.name:''}</div>
    <div class="desc">${l.desc||''}</div>
    <div class="tag">${on?'<i>●</i>พร้อมใช้งาน':'<i>…</i>เร็วๆ นี้'}</div>
  </a>`;
}
function row(label, tone, ico, items, i, tone2, on, slots){
  const pad = slots ? (items.length % SLOTS === 0 && items.length ? 0 : SLOTS - (items.length % SLOTS)) : 0;
  return `<div class="row" style="--c:${tone};--c2:${tone2||YELLOW};--on:${on||'#fff'};animation-delay:${i*50}ms">
    <div class="band">${NAV_ICO[ico]}<span>${label}</span></div>
    <div class="cards">${items.map(card).join("")}${'<div class="slot"><b>+</b>รอเพิ่มระบบ</div>'.repeat(pad)}</div></div>`;
}
function render(){
  $("#favBtn").classList.toggle("on", favOnly);
  const kw = q.trim().toLowerCase();
  const match = l => !kw || [l.name,l.th,l.desc].join(" ").toLowerCase().includes(kw);
  let html = "", i = 0;
  const f = LINKS.filter(l => favs.includes(l.name) && match(l));
  if (f.length) html += row("FAVORITES", RED, "star", f, i++, BLUE, "#fff");
  if (!favOnly){
    let k = 0;
    for (const c of CATS){
      const items = LINKS.filter(l => l.cat === c.key && match(l));
      if (!items.length) continue;
      const th = THEMES[k++ % THEMES.length];          /* สลับสีตามลำดับแถวที่แสดง */
      Object.assign(c, th);
      html += row(c.label, c.tone, c.nav, items, i++, c.tone2, c.on);
    }
  }
  $("#list").innerHTML = html || `<div class="empty">${favOnly?'ยังไม่มีรายการโปรด กดรูปดาวที่การ์ดเพื่อปักหมุด':`ไม่พบระบบ “${q}”`}</div>`;
}

$("#list").addEventListener("click", e => {
  const s = e.target.closest("[data-f]"); if (!s) return;
  e.preventDefault(); e.stopPropagation();
  const n = s.dataset.f;
  favs = favs.includes(n) ? favs.filter(x=>x!==n) : [...favs, n];
  store.set("ah_fav", favs); render();
});
$("#favBtn").onclick = () => { favOnly = !favOnly; render(); };
$("#q").addEventListener("input", e => { q = e.target.value; render(); });
document.addEventListener("keydown", e => {
  const inQ = document.activeElement === $("#q");
  if (!inQ && (e.key === "/" || (e.key.toLowerCase()==="k" && (e.ctrlKey||e.metaKey)))){ e.preventDefault(); $("#q").focus(); }
  if (inQ && e.key === "Escape"){ $("#q").value=""; q=""; render(); $("#q").blur(); }
  if (inQ && e.key === "Enter"){ const a = document.querySelector("#list .card.live"); if (a) a.click(); }
});

function clock(){
  const d = new Date();
  $("#date").textContent = d.toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric"})
    + " · " + d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}) + " น.";
}
$("#sum").textContent = `${LINKS.length} ระบบ · ${CATS.filter(c=>LINKS.some(l=>l.cat===c.key)).length} หมวด · พร้อมใช้งาน ${LINKS.filter(live).length}`;
$("#ver").textContent = APP_VERSION;
clock(); setInterval(clock, 30000); render();
</script>
</body>
</html>
