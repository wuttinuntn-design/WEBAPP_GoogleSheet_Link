<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ศูนย์รวมระบบงานธุรการสาขา และคลังสินค้า</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23006BB6'/%3E%3Cpath fill='%23fff' d='M32 13l17 9.5-17 9.5-17-9.5z'/%3E%3Cpath fill='%23fff' fill-opacity='.7' d='M15 22.5l17 9.5v19l-17-9.5z'/%3E%3Cpath fill='%23fff' fill-opacity='.45' d='M49 22.5L32 32v19l17-9.5z'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#006BB6; --primary-dk:#003B66; --primary-lt:#E6F0F9;
  --accent:#ED1C24; --second:#FFE600;
  --bg:#F3F5F8; --surface:#FFFFFF; --text:#0E1726; --muted:#6B7584; --line:#E6EAF0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --primary:#3C9EE4; --primary-dk:#0A2C4D; --primary-lt:#13263A;
    --accent:#FF4D55; --bg:#0C1017; --surface:#151B24; --text:#E8EDF4; --muted:#8792A2; --line:#232B37;
  }
}
:root[data-theme="dark"]{
  --primary:#3C9EE4; --primary-dk:#0A2C4D; --primary-lt:#13263A;
  --accent:#FF4D55; --bg:#0C1017; --surface:#151B24; --text:#E8EDF4; --muted:#8792A2; --line:#232B37;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 28px}

/* HEADER */
.top{background:var(--surface);border-radius:24px;padding:20px 22px;margin-bottom:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;
  background:var(--primary);box-shadow:0 8px 18px rgba(0,80,140,.28)}
.ttl{flex:1;min-width:240px}
.ttl h1{margin:0;font-size:clamp(20px,2.6vw,28px);font-weight:700;letter-spacing:-.3px;line-height:1.2}
.ttl p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;width:300px;background:var(--bg);border-radius:999px;padding:0 8px 0 14px}
.search svg{flex:none;color:var(--muted)}
#q{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:14px;padding:11px 0;color:var(--text);min-width:0}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:1px 7px;color:var(--muted)}
.pill{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:.15s}
.pill.solid{color:#fff;background:var(--primary);box-shadow:0 8px 18px rgba(0,80,140,.25)}
.pill.solid:hover{filter:brightness(1.1)}
.pill.solid.on{background:var(--accent);box-shadow:0 8px 18px rgba(237,28,36,.25)}
.round{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:.15s}
.round:hover{border-color:var(--primary);color:var(--primary)}

/* ROWS */
.row{--c:var(--primary);--c2:var(--second);display:grid;grid-template-columns:64px 1fr;gap:12px;margin-bottom:12px;animation:up .4s ease both}
.band{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px 0;border-radius:22px;overflow:hidden;
  background:var(--c);
  box-shadow:0 10px 22px color-mix(in srgb,var(--c) 28%,transparent)}
.band svg{width:20px;height:20px;color:var(--on,#fff);position:relative;flex:none}
.band span{position:relative;writing-mode:vertical-rl;transform:rotate(180deg);color:var(--on,#fff);font-weight:700;font-size:13px;letter-spacing:1.4px;white-space:pre-line;text-align:center;line-height:1.25}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

.card{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 14px 16px;min-height:186px;
  background:var(--surface);border:1px solid transparent;border-radius:22px;text-decoration:none;color:inherit;
  transition:transform .2s cubic-bezier(.2,.8,.3,1),box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 40%,transparent);box-shadow:0 16px 34px rgba(14,23,38,.09)}
.card:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 35%,transparent);outline-offset:2px}
.go{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--text);display:grid;place-items:center;transition:.2s;opacity:.85}
.go svg{width:15px;height:15px}
.card:hover .go{background:var(--c);border-color:var(--c);color:var(--on,#fff);opacity:1;transform:rotate(45deg)}
.card.soon .go{border-color:var(--line);color:var(--muted)}
.star{all:unset;cursor:pointer;position:absolute;top:12px;left:12px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#c2cad5;transition:.15s;z-index:2}
.star svg{width:17px;height:17px}
.star:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.star.on{color:var(--accent)}
.ico{width:66px;height:66px;margin:6px 0 12px;transition:transform .3s cubic-bezier(.2,.8,.3,1)}
.ico svg{width:100%;height:100%;overflow:visible}
.card:hover .ico{transform:scale(1.07)}
.name{font-size:16.5px;font-weight:700;line-height:1.35}
.th{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:2px;letter-spacing:.2px}
.desc{font-size:12px;color:var(--muted);margin-top:1px}
.tag{margin-top:auto;padding-top:10px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.tag i{font-style:normal;display:inline-grid;place-items:center;min-width:20px;height:16px;padding:0 4px;border-radius:5px;font-size:10px;border:1px solid currentColor}
.card.live .tag{color:var(--tag,var(--c))}
.type{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:999px;font-size:12px;font-weight:600;
  color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,transparent);border:1px solid color-mix(in srgb,var(--tc) 22%,transparent)}
.type svg{width:16px;height:16px;flex:none}
:root[data-theme="dark"] .type{color:color-mix(in srgb,var(--tc) 55%,#fff)}
.card.soon .tag{color:var(--muted);font-weight:500}
.card.soon{cursor:default}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:186px;border-radius:22px;border:2px dashed var(--line);color:var(--muted);font-size:13px;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.slot b{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:400;color:#b5bfcc}
.card.soon .tag i{border-color:var(--line)}

/* FILTERS */
.filters{background:var(--surface);border-radius:20px;padding:12px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.frow{display:flex;align-items:center;gap:10px;min-width:0}
.flabel{flex:none;width:52px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{all:unset;flex:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:500;
  border:1px solid var(--line);color:var(--text);background:var(--surface);transition:.15s;white-space:nowrap}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip svg{width:15px;height:15px}
.chip .n{font-size:11px;color:var(--muted);background:var(--bg);border-radius:999px;padding:0 7px;line-height:18px}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip.on .n{background:rgba(255,255,255,.22);color:#fff}
.chip.t svg{color:var(--tc)}
.chip.t.on{background:var(--tc);border-color:var(--tc)}
.chip.t.on svg{color:#fff}

/* SETUP MODE */
.pill.ghost{border:1px solid var(--line);color:var(--text);background:var(--surface)}
.pill.ghost:hover{border-color:var(--primary);color:var(--primary)}
#setupBtn.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.tg{all:unset;cursor:pointer;position:absolute;top:12px;right:54px;z-index:3;width:44px;height:24px;border-radius:999px;background:#cfd6df;transition:.2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.tg.on{background:#16a34a}
.tg.on::after{left:23px}
.card.off{opacity:.45;filter:grayscale(.8)}
.card.off .tag{color:var(--muted)!important}
.card.changed{outline:2px dashed var(--primary);outline-offset:3px}
.adminbar{position:sticky;bottom:12px;z-index:20;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 14px 12px 18px;box-shadow:0 16px 40px rgba(14,23,38,.16)}
.adminbar[hidden],.modal[hidden],.filters[hidden]{display:none}
.ab-txt b{display:block;font-size:15px}
.ab-txt span{font-size:12.5px;color:var(--muted)}
.ab-act{display:flex;gap:8px;flex-wrap:wrap}
.ab-act .pill{padding:9px 15px;font-size:13px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,17,27,.45);display:grid;place-items:center;padding:16px}
.dlg{width:min(360px,100%);background:var(--surface);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:8px}
.dlg b{font-size:17px}
.dlg p{margin:0 0 6px;color:var(--muted);font-size:13.5px}
.dlg input{font:inherit;font-size:18px;letter-spacing:6px;text-align:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:0}
.dlg input:focus{border-color:var(--primary)}
.dlg small{color:var(--accent);min-height:16px;font-size:12.5px}
.dlg-act{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.dlg.wide{width:min(520px,100%);max-height:92vh;overflow:auto}
.dlg-h{display:flex;align-items:center;justify-content:space-between}
.ip{width:48px;height:48px;--c:var(--primary);--c2:#FFE600}
.ip svg{width:100%;height:100%}
.dlg label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.dlg label input,.dlg select{font:inherit;font-size:14.5px;font-weight:400;letter-spacing:0;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:0}
.dlg label input:focus,.dlg select:focus{border-color:var(--primary)}
.ftype{margin-top:2px}
.dlg .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-weight:500}
.dlg label.chk input{width:18px;height:18px;padding:0}
.pill.del{color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.pill.del[hidden]{display:none}
.pill:disabled{opacity:.6;cursor:wait}
.edit{all:unset;cursor:pointer;position:absolute;top:50px;right:12px;z-index:3;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.edit:hover{border-color:var(--primary);color:var(--primary)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:60;background:#0E1726;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--accent)}

/* icon paint — solid */
.p{fill:var(--c);stroke:color-mix(in srgb,var(--c) 80%,#000);stroke-opacity:var(--edge,0);stroke-width:1.2} .m{fill:var(--c2)} .s{fill:var(--c2);opacity:.28} .w{fill:var(--surface)}
.ln{fill:none;stroke:var(--c);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.lw{fill:none;stroke:var(--surface);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.lm{fill:none;stroke:var(--c2);stroke-opacity:.35;stroke-width:9;stroke-linecap:round}
.lp{fill:none;stroke:var(--c);stroke-width:9;stroke-linecap:round}

.empty{text-align:center;color:var(--muted);padding:50px 10px;background:var(--surface);border-radius:22px}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:12px;margin-top:14px;padding:0 6px}

@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:1020px){ .cards{grid-template-columns:repeat(3,1fr)} .search{width:240px} }
@media (max-width:720px){
  .wrap{padding:10px}
  .top{padding:16px;border-radius:20px}
  .tools{width:100%} .search{flex:1;width:auto} kbd,.pill .lbl{display:none} .pill{padding:11px 13px}
  .row{grid-template-columns:1fr;gap:8px}
  .band{flex-direction:row;justify-content:flex-start;padding:10px 16px;border-radius:16px}
  .band span{writing-mode:horizontal-tb;transform:none;white-space:normal;letter-spacing:1px}
  .cards{grid-template-columns:repeat(2,1fr);gap:10px}
  .slot{min-height:150px;border-radius:18px}
  .card{min-height:170px;padding:16px 10px 14px;border-radius:18px}
  .ico{width:52px;height:52px}
  .go,.star{width:30px;height:30px}
  .name{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 64 64"><path fill="#fff" d="M32 8l22 12.5L32 33 10 20.5z"/><path fill="#fff" fill-opacity=".72" d="M10 20.5L32 33v25L10 45.5z"/><path fill="#fff" fill-opacity=".45" d="M54 20.5L32 33v25l22-12.5z"/></svg>
    </div>
    <div class="ttl">
      <h1>ศูนย์รวมระบบงานธุรการสาขา และคลังสินค้า</h1>
      <p>รวมโปรแกรมและลิงก์ที่ใช้งานประจำวัน · <span id="date"></span></p>
    </div>
    <div class="tools">
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="ค้นหาระบบ..." autocomplete="off"><kbd>/</kbd>
      </label>
      <button class="pill solid" id="favBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.3l-5.6 2.9 1.1-6.3L2.9 9.5l6.3-.9z"/></svg><span class="lbl">รายการโปรด</span>
      </button>
      <button class="round" id="setupBtn" aria-label="Setup" title="Setup (แอดมิน)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="round" id="themeBtn" aria-label="สลับธีม">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <nav class="filters" id="filters" aria-label="ตัวกรอง">
    <div class="frow"><span class="flabel">หมวด</span><div class="chips" id="catChips"></div></div>
    <div class="frow"><span class="flabel">ประเภท</span><div class="chips" id="typeChips"></div></div>
  </nav>

  <main id="list"></main>

  <div class="adminbar" id="adminbar" hidden>
    <div class="ab-txt"><b>โหมด Setup</b><span id="abInfo"></span></div>
    <div class="ab-act">
      <button class="pill solid" id="abAdd">+ เพิ่มระบบ</button>
      <button class="pill ghost" id="abRefresh">รีเฟรช</button>
      <button class="pill ghost" id="abExit">ออก</button>
    </div>
  </div>

  <div class="modal" id="editModal" hidden>
    <form class="dlg wide" id="editForm">
      <div class="dlg-h"><b id="fTitle">เพิ่มระบบใหม่</b><div class="ip" id="fIconPrev"></div></div>
      <input type="hidden" id="fId">
      <label>ชื่อระบบ (ไทย) *<input id="fTh" placeholder="ระบบติดตาม…"></label>
      <label>ชื่ออังกฤษ<input id="fName" placeholder="Bill Tracker"></label>
      <label>คำอธิบายสั้น<input id="fDesc" placeholder="ใช้ทำอะไร"></label>
      <label>ลิงก์ (Webapp / Google Sheet / อื่นๆ) *<input id="fUrl" type="url" placeholder="https://"><span id="fType" class="ftype"></span></label>
      <div class="two"><label>หมวด<select id="fCat"></select></label><label>ไอคอน<select id="fIcon"></select></label></div>
      <label class="chk"><input type="checkbox" id="fActive"> แสดงให้สาขาเห็น</label>
      <small id="fErr"></small>
      <div class="dlg-act"><button type="button" class="pill del" id="fDel">ลบ</button><span style="flex:1"></span><button type="button" class="pill ghost" id="fCancel">ยกเลิก</button><button class="pill solid" id="fSave">บันทึก</button></div>
    </form>
  </div>
  <div class="toast" id="toast"></div>

  <div class="modal" id="pinModal" hidden>
    <form class="dlg" id="pinForm">
      <b>เข้าสู่โหมด Setup</b>
      <p>ใส่ PIN แอดมิน (ตั้งค่าในชีต CONFIG)</p>
      <input id="pinInput" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">
      <small id="pinErr"></small>
      <div class="dlg-act"><button type="button" class="pill ghost" id="pinCancel">ยกเลิก</button><button class="pill solid">เข้าสู่ระบบ</button></div>
    </form>
  </div>
  <footer><span id="sum"></span><span><span id="sync"></span> · <span id="ver"></span></span></footer>
</div>

<!-- ===== รายการระบบ (แก้/เพิ่มที่นี่) · active:false = ซ่อนจากสาขา ===== -->
<script type="application/json" id="links-data">
[

function jsonp(params, timeout = 20000){
  return new Promise((resolve, reject) => {
    const cb = "cb_" + Date.now() + "_" + Math.floor(Math.random()*1e6);
    const qs = new URLSearchParams({ ...params, callback: cb, _: Date.now() }).toString();
    const sc = document.createElement("script");
    const done = () => { delete window[cb]; sc.remove(); clearTimeout(tm); };
    const tm = setTimeout(() => { done(); reject(new Error("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ (timeout)")); }, timeout);
    window[cb] = res => { done(); res && res.ok ? resolve(res) : reject(new Error((res && res.error) || "เกิดข้อผิดพลาด")); };
    sc.onerror = () => { done(); reject(new Error("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้")); };
    sc.src = API + "?" + qs;
    document.body.appendChild(sc);
  });
}
async function loadLinks(){
  try{

    $("#sync").textContent = "อัปเดต " + new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}) + " น.";
    render();
  }catch(err){
    $("#sync").textContent = "ออฟไลน์ · แสดงข้อมูลล่าสุดที่บันทึกไว้";
  }
}

  wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 13h2M3 10h18M6 6l9-3 1.5 3"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8.5 4.5v9L12 21l-8.5-4.5v-9z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8.3-8 9.5C7.5 20.3 4 17 4 12V6z"/><path d="M8.5 12l2.5 2.5 4.5-4.5"/></svg>',
};
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>';
const STAR  = NAV_ICO.star;
const STAR_O= '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.3l-5.6 2.9 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>';

const $ = s => document.querySelector(s);
const store = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let favs = store.get("ah_fav", []), q = "", favOnly = false;
const live = l => l.url && l.url !== "#";
const catOf = k => CATS.find(c=>c.key===k) || {tone:BLUE,tone2:YELLOW,on:"#fff"};

const t = store.get("ah_theme", null); if (t) document.documentElement.dataset.theme = t;
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next; store.set("ah_theme", next);
};

function card(l){
  const fav = favs.includes(l.name), on = live(l);
  const off = !isOn(l);
  return `<a class="card ${on?'live':'soon'} ${off?'off':''}" style="--c:${catOf(l.cat).tone};--c2:${catOf(l.cat).tone2};--on:${catOf(l.cat).on};--tag:${catOf(l.cat).tone===YELLOW?BLUE:catOf(l.cat).tone}" href="${on?l.url:'javascript:void(0)'}" ${on?'target="_blank" rel="noopener"':''}>
    <button class="star ${fav?'on':''}" data-f="${l.name}" aria-label="ปักหมุด">${fav?STAR:STAR_O}</button>
    <span class="go">${ARROW}</span>
    ${admin?`<button class="tg ${isOn(l)?'on':''}" data-t="${l.id}" aria-label="เปิด/ปิดการแสดง" title="${isOn(l)?'แสดงอยู่ — กดเพื่อซ่อน':'ซ่อนอยู่ — กดเพื่อแสดง'}"></button><button class="edit" data-e="${l.id}" aria-label="แก้ไข" title="แก้ไข">✎</button>`:''}
    <div class="ico"><svg viewBox="0 0 64 64">${ICONS[l.icon]||ICONS.box}</svg></div>
    <div class="name">${l.th||l.name}</div>
    <div class="th">${l.th?l.name:''}</div>
    <div class="desc">${l.desc||''}</div>
    <div class="tag">${off?'<i>✕</i>ซ่อนจากสาขา':on?typeChip(l.url):'<i>…</i>เร็วๆ นี้'}</div>
  </a>`;
}
function row(label, tone, ico, items, i, tone2, on, slots){
  const pad = slots ? (items.length % SLOTS === 0 && items.length ? 0 : SLOTS - (items.length % SLOTS)) : 0;
  return `<div class="row" style="--c:${tone};--c2:${tone2||YELLOW};--on:${on||'#fff'};animation-delay:${i*50}ms">
    <div class="band">${NAV_ICO[ico]}<span>${label}</span></div>
    <div class="cards">${items.map(card).join("")}${'<div class="slot"><b>+</b>รอเพิ่มระบบ</div>'.repeat(pad)}</div></div>`;
}
function renderFilters(base){
  const cats = CATS.filter(c => base.some(l => l.cat === c.key));
  if (catSel !== "all" && !cats.some(c => c.key === catSel)) catSel = "all";
  $("#catChips").innerHTML = `<button class="chip ${catSel==='all'?'on':''}" data-cat="all">ทั้งหมด <span class="n">${base.length}</span></button>` +
    cats.map(c => `<button class="chip ${catSel===c.key?'on':''}" data-cat="${c.key}">${NAV_ICO[c.nav]}${c.th} <span class="n">${base.filter(l=>l.cat===c.key).length}</span></button>`).join("");
  const inCat = base.filter(l => catSel === "all" || l.cat === catSel);
  const types = Object.keys(TYPES).filter(k => inCat.some(l => typeOf(l.url) === k));
  if (typeSel !== "all" && !types.includes(typeSel)) typeSel = "all";
  $("#typeChips").innerHTML = `<button class="chip ${typeSel==='all'?'on':''}" data-type="all">ทั้งหมด</button>` +
    types.map(k => `<button class="chip t ${typeSel===k?'on':''}" style="--tc:${TYPES[k].color}" data-type="${k}">${TYPES[k].svg}${TYPES[k].label} <span class="n">${inCat.filter(l=>typeOf(l.url)===k).length}</span></button>`).join("");
  $("#filters").hidden = base.length < 2;
}
function render(){
  renderFilters(LINKS.filter(visible));
  $("#favBtn").classList.toggle("on", favOnly);
  const kw = q.trim().toLowerCase();
  const match = l => (catSel === "all" || l.cat === catSel) && (typeSel === "all" || typeOf(l.url) === typeSel) && (!kw || [l.name,l.th,l.desc,TYPES[typeOf(l.url)].label].join(" ").toLowerCase().includes(kw));
  let html = "", i = 0;
  const f = LINKS.filter(l => visible(l) && favs.includes(l.name) && match(l));
  if (f.length && !admin) html += row("FAVORITES", RED, "star", f, i++, BLUE, "#fff");
  if (!favOnly){
    let k = 0;
    for (const c of CATS){
      const items = LINKS.filter(l => visible(l) && l.cat === c.key && match(l));
      if (!items.length) continue;
      const th = THEMES[k++ % THEMES.length];          /* สลับสีตามลำดับแถวที่แสดง */
      Object.assign(c, th);
      html += row(c.label, c.tone, c.nav, items, i++, c.tone2, c.on);
    }
  }
  if (admin) $("#abInfo").textContent = `แสดง ${LINKS.filter(isOn).length}/${LINKS.length} ระบบ · สวิตช์ = เปิด/ปิด · ✎ = แก้ไข (บันทึกลงชีตทันที)`;
  $("#sum").textContent = `${LINKS.filter(isOn).length} ระบบ · ${CATS.filter(c=>LINKS.some(l=>isOn(l)&&l.cat===c.key)).length} หมวด · พร้อมใช้งาน ${LINKS.filter(l=>isOn(l)&&live(l)).length}`;
  $("#list").innerHTML = html || `<div class="empty">${favOnly?'ยังไม่มีรายการโปรด กดรูปดาวที่การ์ดเพื่อปักหมุด':q?`ไม่พบระบบ “${q}”`:'ไม่มีระบบในตัวกรองนี้'}</div>`;
}

/* ---------- SETUP (แอดมิน) ---------- */
const openPin = () => { $("#pinModal").hidden = false; $("#pinErr").textContent = ""; $("#pinInput").value = ""; setTimeout(()=>$("#pinInput").focus(), 50); };
const closePin = () => { $("#pinModal").hidden = true; };
function setAdmin(v){ admin = v; if (!v) PIN = ""; $("#adminbar").hidden = !v; $("#setupBtn").classList.toggle("on", v); render(); }
$("#setupBtn").onclick = () => admin ? setAdmin(false) : openPin();
$("#pinCancel").onclick = closePin;
$("#pinModal").addEventListener("click", e => { if (e.target.id === "pinModal") closePin(); });
$("#pinForm").addEventListener("submit", async e => {
  e.preventDefault();
  const pin = $("#pinInput").value.trim(); if (!pin) return;
  const btn = e.submitter || $("#pinForm .solid"); btn.disabled = true; $("#pinErr").textContent = "กำลังตรวจสอบ…";
  try { await jsonp({ action:"login", pin }); PIN = pin; closePin(); setAdmin(true); await loadLinks(); toast("เข้าสู่โหมด Setup แล้ว"); }
  catch(err){ $("#pinErr").textContent = err.message; $("#pinInput").select(); }
  finally { btn.disabled = false; }
});
$("#abExit").onclick = () => setAdmin(false);
$("#abRefresh").onclick = async () => { await loadLinks(); toast("โหลดข้อมูลล่าสุดแล้ว"); };
$("#abAdd").onclick = () => openEdit(null);

async function toggleItem(id){
  if (busy) return;
  const l = LINKS.find(x => x.id === id); if (!l) return;
  const prev = isOn(l); l.active = !prev; render(); busy = true;
  try { await jsonp({ action:"toggle", id, pin:PIN }); toast(l.active ? "แสดงให้สาขาเห็นแล้ว" : "ซ่อนจากสาขาแล้ว"); try{ localStorage.setItem(CACHE_KEY, JSON.stringify(LINKS)); }catch(e){} }
  catch(err){ l.active = prev; render(); toast(err.message, true); }
  finally { busy = false; }
}

/* ฟอร์มเพิ่ม/แก้ไข */
$("#fCat").innerHTML = CATS.map(c => `<option value="${c.key}">${c.th}</option>`).join("");
$("#fIcon").innerHTML = Object.keys(ICONS).map(k => `<option value="${k}">${ICON_NAMES[k]||k}</option>`).join("");
const previewIcon = () => { $("#fIconPrev").innerHTML = `<svg viewBox="0 0 64 64">${ICONS[$("#fIcon").value]||""}</svg>`; };
$("#fIcon").onchange = previewIcon;
const previewType = () => { const v = $("#fUrl").value.trim(); $("#fType").innerHTML = v ? "ตรวจพบ: " + typeChip(v) : ""; };
$("#fUrl").addEventListener("input", previewType);
function openEdit(id){
  const l = id ? LINKS.find(x => x.id === id) : { cat:"daily", icon:"box", active:true };
  $("#fId").value = id || ""; $("#fTitle").textContent = id ? "แก้ไขระบบ" : "เพิ่มระบบใหม่";
  $("#fTh").value = l.th || ""; $("#fName").value = l.name || ""; $("#fDesc").value = l.desc || ""; $("#fUrl").value = l.url || "";
  $("#fCat").value = l.cat || "daily"; $("#fIcon").value = l.icon || "box"; $("#fActive").checked = isOn(l);
  $("#fDel").hidden = !id; $("#fErr").textContent = ""; previewIcon(); previewType();
  $("#editModal").hidden = false; setTimeout(() => $("#fTh").focus(), 50);
}
const closeEdit = () => { $("#editModal").hidden = true; };
$("#fCancel").onclick = closeEdit;
$("#editModal").addEventListener("click", e => { if (e.target.id === "editModal") closeEdit(); });
$("#editForm").addEventListener("submit", async e => {
  e.preventDefault();
  const data = { id: $("#fId").value || undefined, th: $("#fTh").value.trim(), name: $("#fName").value.trim(), desc: $("#fDesc").value.trim(),
                 url: $("#fUrl").value.trim(), cat: $("#fCat").value, icon: $("#fIcon").value, active: $("#fActive").checked };
  if (!data.th) { $("#fErr").textContent = "กรุณาใส่ชื่อระบบ (ไทย)"; return; }
  if (!/^https?:\/\//i.test(data.url)) { $("#fErr").textContent = "ลิงก์ต้องขึ้นต้นด้วย http:// หรือ https://"; return; }
  const btn = $("#fSave"); btn.disabled = true; $("#fErr").textContent = "กำลังบันทึก…";
  try { await jsonp({ action:"save", pin:PIN, data: JSON.stringify(data) }); closeEdit(); await loadLinks(); toast(data.id ? "บันทึกการแก้ไขแล้ว" : "เพิ่มระบบแล้ว"); }
  catch(err){ $("#fErr").textContent = err.message; }
  finally { btn.disabled = false; }
});
$("#fDel").onclick = async () => {
  const id = $("#fId").value; if (!id || !confirm("ลบระบบนี้ออกจากชีตถาวร?\n(ถ้าแค่ไม่อยากให้สาขาเห็น ให้ใช้สวิตช์ปิดแทน)")) return;
  try { await jsonp({ action:"delete", id, pin:PIN }); closeEdit(); await loadLinks(); toast("ลบแล้ว"); }
  catch(err){ $("#fErr").textContent = err.message; }
};

$("#list").addEventListener("click", e => {
  const tg = e.target.closest("[data-t]");
  if (tg){ e.preventDefault(); e.stopPropagation(); toggleItem(tg.dataset.t); return; }
  const ed = e.target.closest("[data-e]");
  if (ed){ e.preventDefault(); e.stopPropagation(); openEdit(ed.dataset.e); return; }
  const s = e.target.closest("[data-f]"); if (!s) return;
  e.preventDefault(); e.stopPropagation();
  const n = s.dataset.f;
  favs = favs.includes(n) ? favs.filter(x=>x!==n) : [...favs, n];
  store.set("ah_fav", favs); render();
});
$("#filters").addEventListener("click", e => {
  const c = e.target.closest("[data-cat]"); if (c){ catSel = c.dataset.cat; typeSel = "all"; render(); return; }
  const t = e.target.closest("[data-type]"); if (t){ typeSel = t.dataset.type; render(); }
});
$("#favBtn").onclick = () => { favOnly = !favOnly; render(); };
$("#q").addEventListener("input", e => { q = e.target.value; render(); });
document.addEventListener("keydown", e => {
  const inQ = document.activeElement === $("#q");
  if (!inQ && (e.key === "/" || (e.key.toLowerCase()==="k" && (e.ctrlKey||e.metaKey)))){ e.preventDefault(); $("#q").focus(); }
  if (inQ && e.key === "Escape"){ $("#q").value=""; q=""; render(); $("#q").blur(); }
  if (inQ && e.key === "Enter"){ const a = document.querySelector("#list .card.live"); if (a) a.click(); }
});

function clock(){
  const d = new Date();
  $("#date").textContent = d.toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric"})
    + " · " + d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}) + " น.";
}
$("#ver").textContent = APP_VERSION;
clock(); setInterval(clock, 30000); render(); loadLinks();
</script>
</body>
</html>
